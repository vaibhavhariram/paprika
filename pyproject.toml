[project]
name = "paprika"
version = "0.1.0"
description = "Execution control infrastructure for AI agents: trace recording, policy enforcement, deterministic replay"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.5,<3",
    "typer>=0.9,<1",
    "httpx>=0.25,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.8",
]
ui = [
    "fastapi>=0.100,<1",
    "uvicorn>=0.20,<1",
]
examples = ["langgraph>=0.2,<1"]

[project.scripts]
paprika = "paprika.cli:app"
demo = "paprika.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paprika"]

[dependency-groups]
dev = [
    "pytest>=7,<9",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: marks tests as integration tests",
]
